# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# PostgreSQL connection
# Change these 3 values to match your local Postgres setup
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/bookreviewdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ddl-auto=update -> Hibernate will create/update tables automatically
# based on your @Entity classes. Great for learning projects, NOT for production.
# show-sql=true -> prints every SQL query Hibernate runs, in the console.
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Swagger / OpenAPI UI
# Once the app is running, open: http://localhost:8080/swagger-ui.html
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
